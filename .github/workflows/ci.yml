name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The unit suite covers the electron-free modules. The remote-access
      # server tests need the pure-JS deps (ws, selfsigned); --ignore-scripts
      # skips the heavy electron download and node-pty native build.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Node >= 21 for the glob pattern in the test script (scoped to test/ so
      # the phone app's own suite under mobile/ is not picked up here).
      - name: Run unit tests
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Checks the IPC boundary (preload.js) against the types/ipc.d.ts contract.
      # Self-contained via npx — no project install needed.
      - name: Typecheck IPC boundary
        run: npm run typecheck

  # Phone app (mobile/): JS unit tests, Android unit tests and a debug APK.
  # No secrets here, so it is safe for pull requests from forks. Release
  # signing happens only in release.yml.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      # Full checkout: the app vendors renderer/diff-parse.mjs and its tests
      # read the shared protocol fixtures under test/fixtures/.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Capacitor 8 builds with JDK 21. ubuntu-latest ships the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        run: npm ci
      - name: JS unit tests
        run: npm test
      - name: Build web assets and sync Android project
        run: npm run build && npx cap sync android
      # Optional: without this secret the APK is built without background alerts.
      - name: Firebase config (optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > mobile/android/app/google-services.json; fi
      - name: Android unit tests and debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: command-center-remote-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
