name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The unit suite covers the electron-free modules (jsonstore, gitinfo,
      # diff-parse, tui-signals) and needs no dependencies, so skip the heavy
      # electron/node-pty install and just run the tests directly.
      - name: Install dev dependencies
        run: npm install --ignore-scripts
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-javascript
          path: coverage/cobertura-coverage.xml

  upload-coverage-javascript:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-javascript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: code-coverage-agent

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Checks the IPC boundary (preload.js) against the types/ipc.d.ts contract.
      # Self-contained via npx — no project install needed.
      - name: Typecheck IPC boundary
        run: npm run typecheck
