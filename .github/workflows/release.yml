name: Release

# Semantic-version release driven by Conventional Commits, mirroring the
# dno-ontwikkeling house pattern (see poe-live-trade-extension).
#
# Commit-message → version bump (mathieudutour/github-tag-action):
#   feat: ...            → minor (0.1.0 → 0.2.0)
#   fix: ...             → patch (0.1.0 → 0.1.1)
#   BREAKING CHANGE / !  → major (0.1.0 → 1.0.0)
#   docs/chore/refactor/… → no release (default_bump: false)
#
# A push to main with no feat/fix/breaking commit produces no tag and no
# release. When a bump happens the Windows job builds the installer and
# attaches it to a GitHub pre-release; promote-release.yml flips it to stable.
#
# workflow_dispatch with `version` set skips the auto-bump and releases that
# exact version — an escape hatch for when the computed tag name is unusable
# (e.g. a version name burned by a prior immutable release).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "stories/**"
      - "reviews/**"
      - ".claude/**"
      - "test/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, e.g. 1.1.1 (no leading v). Empty = auto-bump from commits."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.out.outputs.new_tag }}
      new_version: ${{ steps.out.outputs.new_version }}
      changelog: ${{ steps.out.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump version and create tag
        id: auto
        if: ${{ github.event_name == 'push' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Create explicit tag
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        env:
          V: ${{ inputs.version }}
        run: |
          git tag "v$V"
          git push origin "v$V"
          echo "new_tag=v$V" >> "$GITHUB_OUTPUT"
          echo "new_version=$V" >> "$GITHUB_OUTPUT"

      - name: Consolidate outputs
        id: out
        env:
          AUTO_TAG: ${{ steps.auto.outputs.new_tag }}
          AUTO_VER: ${{ steps.auto.outputs.new_version }}
          AUTO_LOG: ${{ steps.auto.outputs.changelog }}
          MAN_TAG: ${{ steps.manual.outputs.new_tag }}
          MAN_VER: ${{ steps.manual.outputs.new_version }}
        run: |
          if [ -n "$MAN_TAG" ]; then
            echo "new_tag=$MAN_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=$MAN_VER" >> "$GITHUB_OUTPUT"
            echo "changelog=Manual release $MAN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=$AUTO_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=$AUTO_VER" >> "$GITHUB_OUTPUT"
            {
              echo "changelog<<CHANGELOG_EOF"
              echo "$AUTO_LOG"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version to the release tag
        shell: bash
        env:
          V: ${{ needs.tag.outputs.new_version }}
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');p.version=process.env.V;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "package.json version set to $V"

      - name: Build installer
        # --publish never: electron-builder only packages; the release upload
        # below is owned by action-gh-release, not electron-builder.
        run: npm run dist -- --publish never

      # Upload to a DRAFT first (drafts stay mutable), then publish it. This is
      # required when immutable releases is on (prereleases publish on creation,
      # freezing assets before they upload) and is harmless when it is off.
      - name: Upload installer to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          prerelease: true
          draft: true
          files: dist/*.exe

      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.tag.outputs.new_tag }}" --draft=false --prerelease
