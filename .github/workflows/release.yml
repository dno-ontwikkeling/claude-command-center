name: Release

# Semantic-version release driven by Conventional Commits, mirroring the
# dno-ontwikkeling house pattern (see poe-live-trade-extension).
#
# Commit-message → version bump (mathieudutour/github-tag-action):
#   feat: ...            → minor (0.1.0 → 0.2.0)
#   fix: ...             → patch (0.1.0 → 0.1.1)
#   BREAKING CHANGE / !  → major (0.1.0 → 1.0.0)
#   docs/chore/refactor/… → no release (default_bump: false)
#
# A push to main with no feat/fix/breaking commit produces no tag and no
# release. When a bump happens: `draft` creates a draft release, the Windows
# job (installer) and the android job (signed phone APK) upload to it in
# parallel, and `publish` makes it a pre-release once both are attached;
# promote-release.yml flips it to stable. If either build fails nothing is
# published: re-run the failed job to finish the same release.
#
# workflow_dispatch with `version` set skips the auto-bump and releases that
# exact version — an escape hatch for when the computed tag name is unusable
# (e.g. a version name burned by a prior immutable release).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "stories/**"
      - "reviews/**"
      - ".claude/**"
      - "test/**"
      - "mobile/test/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, e.g. 1.1.1 (no leading v). Empty = auto-bump from commits."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.out.outputs.new_tag }}
      new_version: ${{ steps.out.outputs.new_version }}
      changelog: ${{ steps.out.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump version and create tag
        id: auto
        if: ${{ github.event_name == 'push' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Create explicit tag
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        env:
          V: ${{ inputs.version }}
        run: |
          git tag "v$V"
          git push origin "v$V"
          echo "new_tag=v$V" >> "$GITHUB_OUTPUT"
          echo "new_version=$V" >> "$GITHUB_OUTPUT"

      - name: Consolidate outputs
        id: out
        env:
          AUTO_TAG: ${{ steps.auto.outputs.new_tag }}
          AUTO_VER: ${{ steps.auto.outputs.new_version }}
          AUTO_LOG: ${{ steps.auto.outputs.changelog }}
          MAN_TAG: ${{ steps.manual.outputs.new_tag }}
          MAN_VER: ${{ steps.manual.outputs.new_version }}
        run: |
          if [ -n "$MAN_TAG" ]; then
            echo "new_tag=$MAN_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=$MAN_VER" >> "$GITHUB_OUTPUT"
            echo "changelog=Manual release $MAN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=$AUTO_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=$AUTO_VER" >> "$GITHUB_OUTPUT"
            {
              echo "changelog<<CHANGELOG_EOF"
              echo "$AUTO_LOG"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

  # Create the draft ONCE. The Windows and Android jobs then only upload to it
  # (two parallel jobs creating it could produce duplicate drafts), and
  # `publish` flips it live after both finish. Drafts stay mutable, which
  # matters when immutable releases is on.
  draft:
    needs: tag
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.new_tag }}
          CHANGELOG: ${{ needs.tag.outputs.changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --draft --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: [tag, draft]
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version to the release tag
        shell: bash
        env:
          V: ${{ needs.tag.outputs.new_version }}
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');p.version=process.env.V;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "package.json version set to $V"

      - name: Bundle the FCM sender key (optional)
        shell: bash
        env:
          FCM: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
        run: |
          mkdir -p bundled
          if [ -n "$FCM" ]; then echo "$FCM" | base64 -d > bundled/fcm-key.json; fi

      - name: Build installer
        # --publish never: electron-builder only packages; the release upload
        # below goes to the draft the `draft` job created.
        run: npm run dist -- --publish never

      - name: Upload installer to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: gh release upload "$TAG" dist/*.exe --clobber

  # The phone app (mobile/), signed with the fixed release keystore so each
  # APK installs over the previous one. Runs in parallel with the Windows build.
  android:
    needs: [tag, draft]
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.new_tag }}
      V: ${{ needs.tag.outputs.new_version }}
    steps:
      - name: Require the release keystore secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (see mobile/README.md, keystore setup)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, for the versionCode check below

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # A sideloaded update only installs over the previous APK when its
      # versionCode is higher, so refuse to build one that isn't (e.g. a
      # workflow_dispatch with an explicit lower version).
      - name: Compute and check versionCode
        id: code
        run: |
          code=$(node mobile/scripts/version-code.mjs "$V")
          max=0
          for t in $(git tag -l 'v*'); do
            [ "$t" = "$TAG" ] && continue
            c=$(node mobile/scripts/version-code.mjs "$t" 2>/dev/null) || continue
            [ "$c" -gt "$max" ] && max=$c
          done
          if [ "$code" -le "$max" ]; then
            echo "::error::versionCode $code for $TAG is not higher than an existing release ($max); the APK could not update in place."
            exit 1
          fi
          echo "versionCode=$code (previous max $max)"
          echo "value=$code" >> "$GITHUB_OUTPUT"

      - name: Install, sync version, build web assets
        working-directory: mobile
        run: |
          npm ci
          npm version "$V" --no-git-tag-version --allow-same-version
          npm run build
          npx cap sync android

      # Optional: without this secret the APK is built without background alerts.
      - name: Firebase config (optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > mobile/android/app/google-services.json; fi
      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          CC_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CODE: ${{ steps.code.outputs.value }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PccVersionName="$V" -PccVersionCode="$CODE" --console=plain

      - name: Verify signature and name the APK
        run: |
          bt=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/$bt/apksigner" verify --print-certs "$apk"
          cp "$apk" "command-center-remote-$V.apk"

      - name: Upload APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "command-center-remote-$V.apk" --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # Publish only after BOTH artifacts are attached: with immutable releases on,
  # assets are frozen the moment a release is published.
  publish:
    needs: [tag, build, android]
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: gh release edit "$TAG" --draft=false --prerelease
