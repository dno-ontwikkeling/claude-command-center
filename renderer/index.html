<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Command Center</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header class="bar">
        <span class="title">Worktrees</span>
        <div class="actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle theme">◐</button>
          <button id="add-project" class="icon-btn" title="Add project">＋</button>
        </div>
      </header>
      <ul id="project-list"></ul>
      <footer class="sidebar-footer">
        <button id="prompts-btn" class="settings-btn" title="Insert a smart prompt into the active worktree">✦ Prompts</button>
        <button id="settings-btn" class="settings-btn">⚙ Settings</button>
      </footer>
    </aside>

    <div id="sidebar-resizer" title="Drag to resize"></div>

    <main id="stage">
      <div id="empty" class="empty">Select a project to launch a worktree.</div>
      <div id="stage-bar" hidden>
        <span id="sb-branch" class="sb-branch"></span>
        <div class="sb-actions">
          <button id="sb-fetch" class="sb-btn" title="git fetch --prune">Fetch</button>
          <button id="sb-pull" class="sb-btn" title="git pull --ff-only">Pull</button>
          <button id="sb-find" class="sb-btn" title="Find in terminal (Ctrl+F)">Find</button>
        </div>
      </div>
      <div id="term-search" hidden>
        <input id="search-input" type="text" placeholder="Find in terminal…" />
        <label class="search-opt" title="Match case"><input id="search-case" type="checkbox" />Aa</label>
        <label class="search-opt" title="Regex"><input id="search-regex" type="checkbox" />.*</label>
        <button id="search-prev" class="sb-btn" title="Previous (Shift+Enter)">▲</button>
        <button id="search-next" class="sb-btn" title="Next (Enter)">▼</button>
        <button id="search-close" class="sb-btn" title="Close (Esc)">✕</button>
      </div>
      <div id="terminals"></div>
    </main>

    <div id="settings" class="overlay" hidden>
      <div class="modal">
        <header>
          <span>Settings</span>
          <button id="settings-close" class="icon-btn">✕</button>
        </header>
        <label>Theme
          <select id="set-theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label>Font size
          <input id="set-fontsize" type="number" min="8" max="32" step="1" />
        </label>
        <label>Font family
          <select id="set-fontfamily">
            <option value="Cascadia Mono, Consolas, monospace">Cascadia Mono</option>
            <option value="Cascadia Code, monospace">Cascadia Code</option>
            <option value="JetBrains Mono, monospace">JetBrains Mono</option>
            <option value="Fira Code, monospace">Fira Code</option>
            <option value="Consolas, monospace">Consolas</option>
          </select>
        </label>
        <label>Cursor style
          <select id="set-cursor">
            <option value="bar">Bar</option>
            <option value="block">Block</option>
            <option value="underline">Underline</option>
          </select>
        </label>
        <label>Cursor blink
          <input id="set-blink" type="checkbox" />
        </label>
        <label>Scrollback
          <input id="set-scrollback" type="number" min="100" max="100000" step="100" />
        </label>
        <label>Bypass permissions
          <input id="set-bypass" type="checkbox" />
        </label>
        <p class="hint">Bypass applies to newly launched worktrees.</p>
        <label>Desktop notifications
          <input id="set-notifications" type="checkbox" />
        </label>
        <label>Notification sound
          <input id="set-sound" type="checkbox" />
        </label>
        <p class="hint">Alerts when a worktree needs input or finishes while unfocused.</p>
      </div>
    </div>

    <div id="wt-picker" class="overlay" hidden>
      <div class="modal wt-modal">
        <header>
          <span id="wt-title">Open worktree</span>
          <button id="wt-close" class="icon-btn">✕</button>
        </header>

        <!-- View 1: search an existing worktree/branch to open; the search box
             doubles as the new-branch name, enabling the Create button. -->
        <div id="wt-view-pick" class="wt-view">
          <input
            id="wt-search"
            type="text"
            class="wt-search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search a branch to open, or type a new name…"
          />
          <ul id="wt-results" class="wt-results"></ul>
          <button id="wt-newbtn" class="btn-primary wt-newbtn" disabled>＋ Create new branch</button>
        </div>

        <!-- View 2: choose the base ref for the new branch (reuses the list UI) -->
        <div id="wt-view-base" class="wt-view" hidden>
          <button id="wt-base-back" class="wt-back">← Back</button>
          <div class="wt-substep">Base for <span id="wt-base-name" class="wt-branch"></span></div>
          <input
            id="wt-base-search"
            type="text"
            class="wt-search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search base branch…"
          />
          <ul id="wt-base-results" class="wt-results"></ul>
        </div>
      </div>
    </div>

    <div id="confirm" class="overlay" hidden>
      <div class="modal">
        <header>
          <span id="confirm-title">Confirm</span>
          <button id="confirm-x" class="icon-btn">✕</button>
        </header>
        <p id="confirm-msg" class="confirm-msg"></p>
        <label id="confirm-check-row" class="confirm-check" hidden>
          <input id="confirm-check" type="checkbox" />
          <span id="confirm-check-label"></span>
        </label>
        <div class="modal-actions">
          <button id="confirm-cancel" class="btn-ghost">Cancel</button>
          <button id="confirm-ok" class="btn-primary">OK</button>
        </div>
      </div>
    </div>

    <div id="prompt" class="overlay" hidden>
      <div class="modal">
        <header>
          <span id="prompt-title">Input</span>
          <button id="prompt-cancel" class="icon-btn">✕</button>
        </header>
        <input id="prompt-input" type="text" />
        <button id="prompt-ok" class="btn-primary">OK</button>
      </div>
    </div>

    <div id="prompts-mgr" class="overlay" hidden>
      <div class="modal">
        <header>
          <span>Manage prompts</span>
          <button id="pm-close" class="icon-btn">✕</button>
        </header>
        <ul id="pm-list" class="pm-list"></ul>
        <div id="pm-editor" class="pm-editor" hidden>
          <input id="pm-label" type="text" placeholder="Label" />
          <textarea id="pm-text" rows="4" placeholder="Prompt text — use {branch} / {cwd}"></textarea>
          <div class="modal-actions">
            <button id="pm-cancel" class="btn-ghost">Cancel</button>
            <button id="pm-save" class="btn-primary">Save</button>
          </div>
        </div>
        <button id="pm-add" class="btn-primary">✚ Add prompt</button>
      </div>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
    <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
