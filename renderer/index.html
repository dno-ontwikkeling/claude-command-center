<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Command Center</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header class="bar">
        <span class="title">Agents</span>
        <div class="actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle theme">◐</button>
          <button id="add-project" class="icon-btn" title="Add project">＋</button>
        </div>
      </header>
      <ul id="project-list"></ul>
      <footer class="sidebar-footer">
        <button id="settings-btn" class="settings-btn">⚙ Settings</button>
      </footer>
    </aside>

    <main id="stage">
      <div id="empty" class="empty">Select a project to launch an agent.</div>
      <div id="terminals"></div>
    </main>

    <div id="settings" class="overlay" hidden>
      <div class="modal">
        <header>
          <span>Settings</span>
          <button id="settings-close" class="icon-btn">✕</button>
        </header>
        <label>Theme
          <select id="set-theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label>Font size
          <input id="set-fontsize" type="number" min="8" max="32" step="1" />
        </label>
        <label>Font family
          <select id="set-fontfamily">
            <option value="Cascadia Mono, Consolas, monospace">Cascadia Mono</option>
            <option value="Cascadia Code, monospace">Cascadia Code</option>
            <option value="JetBrains Mono, monospace">JetBrains Mono</option>
            <option value="Fira Code, monospace">Fira Code</option>
            <option value="Consolas, monospace">Consolas</option>
          </select>
        </label>
        <label>Cursor style
          <select id="set-cursor">
            <option value="bar">Bar</option>
            <option value="block">Block</option>
            <option value="underline">Underline</option>
          </select>
        </label>
        <label>Cursor blink
          <input id="set-blink" type="checkbox" />
        </label>
        <label>Scrollback
          <input id="set-scrollback" type="number" min="100" max="100000" step="100" />
        </label>
        <label>Bypass permissions
          <input id="set-bypass" type="checkbox" />
        </label>
        <p class="hint">Bypass applies to newly launched agents.</p>
      </div>
    </div>

    <div id="wt-picker" class="overlay" hidden>
      <div class="modal">
        <header>
          <span id="wt-title">New agent — choose worktree</span>
          <button id="wt-close" class="icon-btn">✕</button>
        </header>

        <div class="wt-section">
          <div class="wt-section-title">Existing worktrees</div>
          <ul id="wt-list" class="wt-list"></ul>
        </div>

        <div class="wt-section">
          <div class="wt-section-title">New branch</div>
          <div class="wt-newbranch">
            <input id="wt-newname" type="text" placeholder="feature/my-branch" />
            <button id="wt-create" class="btn-primary">Create</button>
          </div>
          <div id="wt-newname-err" class="wt-err"></div>
        </div>

        <div class="wt-section">
          <div class="wt-section-title">From existing branch</div>
          <ul id="wt-branches" class="wt-list"></ul>
        </div>
      </div>
    </div>

    <div id="confirm" class="overlay" hidden>
      <div class="modal">
        <header>
          <span id="confirm-title">Confirm</span>
          <button id="confirm-x" class="icon-btn">✕</button>
        </header>
        <p id="confirm-msg" class="confirm-msg"></p>
        <div class="modal-actions">
          <button id="confirm-cancel" class="btn-ghost">Cancel</button>
          <button id="confirm-ok" class="btn-primary">OK</button>
        </div>
      </div>
    </div>

    <div id="prompt" class="overlay" hidden>
      <div class="modal">
        <header>
          <span id="prompt-title">Input</span>
          <button id="prompt-cancel" class="icon-btn">✕</button>
        </header>
        <input id="prompt-input" type="text" />
        <button id="prompt-ok" class="btn-primary">OK</button>
      </div>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="app.js"></script>
  </body>
</html>
