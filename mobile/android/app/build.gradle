apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

kotlin {
    jvmToolchain(21)
}

// Release workflow passes -PccVersionName=1.2.3 -PccVersionCode=10203
// (computed by scripts/version-code.mjs); local builds default to 0.0.0 / 1.
def ccVersionName = providers.gradleProperty('ccVersionName').getOrElse('0.0.0')
def ccVersionCode = providers.gradleProperty('ccVersionCode').getOrElse('1').toInteger()

// Release signing comes from the environment (CI decodes the keystore secret
// to a temp file). Without it the release build is left unsigned instead of
// failing, so local `assembleRelease` still works.
def keystorePath = System.getenv('CC_KEYSTORE_PATH')
def hasReleaseKey = keystorePath && file(keystorePath).exists()

android {
    namespace = "com.olivier.commandcenter.remote"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('CC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CC_KEY_ALIAS')
                keyPassword System.getenv('CC_KEY_PASSWORD')
            }
        }
    }
    defaultConfig {
        applicationId "com.olivier.commandcenter.remote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ccVersionCode
        versionName ccVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        // Shared protocol fixtures (the desktop's test/fixtures/remote-proto),
        // so the Kotlin tests check the same contract as the Node tests.
        test.resources.srcDirs += ['../../../test/fixtures/remote-proto']
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Native, cert-pinned WebSocket to the desktop (see PinnedSocket.kt).
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // FCM data messages deliver the PC's alerts with the app closed (PushService).
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:okhttp-tls:$okhttpVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver3:$okhttpVersion"
    // android.jar's org.json is a stub on the JVM (returns defaults).
    testImplementation "org.json:json:$orgJsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
